  blueprint-read:
    layer: tcp-55558
    priority: 1
    description: Blueprint introspection — read graph, variables, functions, components
    # MOVE-TO-SIDECAR per D54/§Q1.2: get_blueprint_graphs, get_animbp_graph (full) and
    # the EventGraph subset of get_widget_blueprint are absorbed by the 3F sidecar
    # milestone (M2-Phase-A). The 9 sidecar traversal verbs (bp_list_graphs,
    # bp_trace_exec, etc.) will land in the offline toolset, not here.
    tools:
      # reduced_scope: runtime-reflected interface list + UClass flags only (structural fields shipped offline per D37)
      # displaced_by: inspect_blueprint, query_asset_registry, read_asset_properties
      get_blueprint_info:
        description: Parent class, interfaces, component list, variable count, function count. Overview without loading full graph.
        params:
          asset_path: { type: string, required: true }
      # reduced_scope: reflection-only metadata (replication flags, EditAnywhere, tooltips, Category); CDO values shipped offline post-Agent-10
      # displaced_by: inspect_blueprint (include_defaults), read_asset_properties
      get_blueprint_variables:
        description: All variables with types, default values, categories, replication flags, tooltips
        params:
          asset_path: { type: string, required: true }
      # reduced_scope: full function signatures (params, return type, static/const/pure flags); name-level enumeration shipped offline per D48 S-A
      # displaced_by: find_blueprint_nodes, inspect_blueprint
      get_blueprint_functions:
        description: All functions with full signatures (params, return type, static/const/pure flags)
        params:
          asset_path: { type: string, required: true }
      # reduced_scope: live-attached-via-construction-script components (not saved in .uasset); SCS tree + defaults shipped offline
      # displaced_by: inspect_blueprint, read_asset_properties
      get_blueprint_components:
        description: Component hierarchy tree with classes, attached-to relationships, and default property values
        params:
          asset_path: { type: string, required: true }
      # reduced_scope: full delegate binding targets (which function bound on which object) via UEdGraph pin trace; presence-only shipped offline per D48
      # displaced_by: find_blueprint_nodes
      get_blueprint_event_dispatchers:
        description: All event dispatchers with parameter signatures
        wire_type: get_event_dispatchers
        params:
          asset_path: { type: string, required: true }
      # M-enhance CP3/CP4 addition — plugin bp_compile_and_report handler
      # captures FCompilerResultsLog (what UBlueprintEditorLibrary::CompileBlueprint
      # cannot — void return per D66 / FA-ε §Q1.4).
      bp_compile_and_report:
        description: Compile a Blueprint and return errors + warnings + notes + info with per-entry node_guid.
        params:
          asset_path: { type: string, required: true }
      # reduced_scope: widget hierarchy tree + property bindings only — EventGraph + functions subset MOVE-TO-SIDECAR (3F) per D56/§Q1.2
      # displaced_by: 3F sidecar (EventGraph + functions subset); plugin retains UMG/Slate designer data surface
      get_widget_blueprint:
        description: Widget hierarchy tree (designer view), property bindings, plus standard EventGraph and functions.
        params:
          asset_path: { type: string, required: true }
      # reduced_scope: compiled Niagara VM state + emitter graph evaluation; static params + bounds shipped offline via D50
      # displaced_by: read_asset_properties
      get_niagara_system_info:
        description: UNiagaraSystem metadata — emitter names, user-exposed parameters, fixed bounds. Read-only.
        params:
          asset_path: { type: string, required: true }

