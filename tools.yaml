          text:           { type: string, required: false, description: "Initial text, default 'New Text Block'" }
          position:       { type: array, required: false, description: "[x, y] canvas position" }
      add_button:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: add_button_to_widget
        description: Add button with child TextBlock to widget (requires root CanvasPanel). Does NOT auto-compile or save — call compile_blueprint after batch mutations and persist explicitly when ready.
        params:
          blueprint_name: { type: string, required: true, description: "Widget blueprint name" }
          widget_name:    { type: string, required: true, description: "Button widget name" }
          text:           { type: string, required: true, description: "Button label text" }
          position:       { type: array, required: false, description: "[x, y] canvas position" }
      bind_widget_event:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: true
        compiles_asset: true
        offline_fallback: false
        description: Bind widget event (e.g. OnClicked) to function in event graph. Self-compiles + saves on completion (compile is required to materialize the FObjectProperty on GeneratedClass before wiring the bound event).
        params:
          blueprint_name: { type: string, required: true, description: "Widget blueprint name" }
          widget_name:    { type: string, required: true, description: "Widget to bind event on" }
          event_name:     { type: string, required: true, description: "Event name e.g. OnClicked" }
      set_text_block_binding:
        # M3-widgets fix (D23 oracle retirement): TCP:55558 handler creates a pure
        # FText getter (correct K2 schema connections) and registers an
        # FDelegateEditorBinding on the TextBlock's Text property. Binding now
        # evaluates at runtime; oracle's exec→data invalid pin connection retired.
        description: Set text block data binding — creates pure FText getter and registers FDelegateEditorBinding. Self-compiles + saves on completion (compile is required to translate the new function graph into the generated class).
        params:
          blueprint_name: { type: string, required: true, description: "Widget blueprint name" }
          widget_name:    { type: string, required: true, description: "TextBlock widget to bind" }
          binding_name:   { type: string, required: true, description: "Variable name for the binding" }
      add_widget_to_viewport:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: true
        mutates_asset: false
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        # M3-widgets fix (D23 oracle retirement): TCP:55558 handler now creates a
        # widget instance against the PIE world's PlayerController and calls
        # AddToViewport(z_order). Returns NOT_IN_PIE error if PIE is not running
        # (engine restriction — AddToViewport requires a live game world).
        description: Show widget in PIE game viewport (requires PIE running — returns NOT_IN_PIE error otherwise)
        params:
          blueprint_name: { type: string, required: true, description: "Widget blueprint name" }
          z_order:        { type: integer, required: false, description: "Z-order, default 0" }
      add_input_action_node:
        wire_type: add_blueprint_input_action_node
        description: Add input action event node (legacy Input Actions, NOT Enhanced Input). Only marks BP modified — call compile_blueprint to materialize the new node into the generated class.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name (works on any BP, not just widgets)" }
          action_name:    { type: string, required: true, description: "Input action name" }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }

