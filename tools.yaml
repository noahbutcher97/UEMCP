# tools.yaml — Single source of truth for UEMCP tool registry
# All tool counts, toolset membership, and descriptions are derived from this file.
# The Node.js MCP server loads this at startup. Plan markdown references it.
#
# Conventions:
#   - Tool names are unique across the entire registry (MCP requirement)
#   - Handler filename = UEMCP${PascalCase(toolsetName)}Commands.h/.cpp
#     Exception: input-and-pie splits into UEMCPInputCommands + UEMCPPIECommands
#   - params: stubs — populated incrementally during implementation
#   - Legacy-oracle-derived toolsets may keep priority: null after reimplementation

# ─────────────────────────────────────────────────────────────
# Always-loaded management tools (10)
# Visible to Claude regardless of which toolsets are enabled
# ─────────────────────────────────────────────────────────────
management:
  description: Always-loaded discovery and management tools
  tools:
    connection_info:
      description: Show project attachment, targetAttachment metadata for alias/profile attaches, deploy freshness, editor/transport readiness, active layers, and enabled toolsets.
      params:
        force_reconnect: { type: boolean, required: false, default: false }

    detect_project:
      description: Run editor project detection and report candidates without attaching the session.
      params: {}

    find_tools:
      description: Keyword search across all tools. Auto-enables matching project-scoped toolsets only when a project is attached.
      params:
        query:       { type: string, required: true }
        max_results: { type: integer, required: false, default: 15 }

    list_toolsets:
      description: Show all toolsets with tool count, required layer, availability status, and enabled/disabled state. Orientation tool — call first to understand what's available.
      params: {}

    enable_toolset:
      description: Explicitly enable one or more toolsets by name. Project-scoped toolsets require an attached project.
      params:
        toolsets: { type: array, items: string, required: true }

    disable_toolset:
      description: Disable one or more toolsets to free context. Use when switching tasks or active tool count is high.
      params:
        toolsets: { type: array, items: string, required: true }

    list_project_targets:
      description: Read repo-root .uemcp-targets.json profiles, or legacy .uemcp-targets.txt when no structured config exists, and report project attachment candidates, aliases, invalid entries, warnings, and duplicate-stem collisions.
      params:
        profile: { type: string, required: false }

    attach_project:
      description: Attach an Unreal project for the current MCP session from a project root, .uproject path, configured target alias, optional target profile, running-editor path, or elicited prompt.
      params:
        project_root: { type: string, required: false }
        uproject_path: { type: string, required: false }
        target: { type: string, required: false }
        target_profile: { type: string, required: false }
        from_running_editor: { type: string, required: false }
        allow_outside_client_roots: { type: boolean, required: false, default: false }
        force_generation_change: { type: boolean, required: false, default: false }
        prompt: { type: boolean, required: false, default: false }

    detach_project:
      description: Clear manual project attachment, rerun workspace resolution, reset project-scoped caches, and refresh visible toolsets.
      params: {}

    refresh_project_context:
      description: Re-read negotiated MCP roots or fallback workspace roots, refresh project candidates, and re-resolve session project attachment.
      params: {}


# ─────────────────────────────────────────────────────────────
# Toolsets (16 toolsets, 138 tools) — plus 10 management tools above = 148 total
# ─────────────────────────────────────────────────────────────
toolsets:

  # ── Offline Layer ─────────────────────────────────────────
  offline:
    layer: offline
    priority: null   # built into Phase 1
    description: Project file analysis — always works, no editor needed
    tools:
      project_info:
        description: Read .uproject, list plugins, engine version, build config
      list_gameplay_tags:
        description: Parse DefaultGameplayTags.ini, return full tag hierarchy with comments
      search_gameplay_tags:
        description: Search tags by pattern (e.g., "Gameplay.State.*"). Globs - * matches one segment, ** matches across segments. Case-insensitive.
        params:
          pattern: { type: string, required: true, description: "Glob pattern matching tag hierarchy. * = single segment (no dots), ** = multiple segments." }
      list_config_values:
        description: Read any .ini config file. Progressive drill-down - call with no args to list files, with config_file to list sections, with all three for the value array. Section/key are case-insensitive.
        params:
          config_file: { type: string, required: false, description: "Filename with .ini extension (e.g., DefaultEngine.ini). Omit to list all available config files." }
          section:     { type: string, required: false, description: "Section name without brackets (e.g., /Script/Engine.Engine). Omit to list all sections in the file." }
          key:         { type: string, required: false, description: "Key name within the section. When set, returns all values for the key (multi-value keys return arrays)." }
      get_asset_info:
        description: Read .uasset header metadata (type, size, class, references). By default strips large blob tags (>1KB). Set verbose:true to return all tags.
        params:
          asset_path: { type: string, required: true, description: "Asset path (/Game/... or relative to project)" }
          verbose:    { type: boolean, required: false, default: false, description: "When false, strips blob tags exceeding 1KB. When true, returns all tags." }
      query_asset_registry:
        description: Bulk scan Content/ for assets matching class/path/tag filters. Returns up to `limit` results with objectClassName, tags, package name, export count. Supports pagination via offset/limit.
        params:
          class_name:  { type: string, required: false, description: "Exact match on primary object class (e.g., Blueprint, /Script/Engine.DataTable). Short names supported (e.g., DataTable for /Script/Engine.DataTable)." }
          path_prefix: { type: string, required: false, description: "/Game or /Game/... path to narrow the scan root (not a post-filter)" }
          tag_key:     { type: string, required: false, description: "Asset-registry tag key to require (e.g., BlueprintType, ParentClass)" }
          tag_value:   { type: string, required: false, description: "When provided, tag_key must equal this value. Omit for presence-only check." }
          limit:       { type: number, required: false, description: "Max matches returned (default 200, cap 2000)" }
          offset:      { type: number, required: false, description: "Result offset for pagination (default 0). Use with limit to page through results." }
          max_scan:    { type: number, required: false, description: "Max files walked (default 5000, cap 20000). Response sets truncated:true when hit." }
          verbose:     { type: boolean, required: false, default: false, description: "When false, strips blob tags exceeding 1KB. When true, returns all tags." }
      inspect_blueprint:
        description: Deep introspection of a .uasset (BP, UMG widget, AnimBP, DataAsset). Returns export table with resolved class/super/outer names, parent class, generated class. With include_defaults=true, also returns CDO UPROPERTY values (scalars, 10 engine structs, simple-element TArray/TSet; custom structs and complex containers marked unsupported). Use this for structural view + a convenience CDO dump in one call; use read_asset_properties when you need values on a non-CDO export or a filtered subset. NOTE - tags removed; use get_asset_info for asset-registry metadata. The old `verbose` param is no longer accepted (renamed to include_defaults with new semantics). Pointed query — not cached.
        params:
          asset_path:       { type: string, required: true, description: "/Game/... path (with or without .uasset extension) or project-relative Content/... path" }
          include_defaults: { type: boolean, required: false, default: false, description: "When true, include variable_defaults (decoded CDO UPROPERTYs) and an unsupported_defaults list." }
      list_level_actors:
        description: Enumerate placed actors in a .umap with transforms (location, rotation, scale from the actor's root component). Filters to exports whose outerIndex resolves to PersistentLevel/Level. Paginated — use limit/offset to page through dense maps, or summarize_by_class for an overview before drilling down. For a single actor's deeper UPROPERTY values (damage stats, tags, refs), follow up with read_asset_properties on the actor's export. Pointed query — not cached.
        params:
          asset_path:         { type: string, required: true, description: "/Game/... path to a .umap (with or without .umap extension)" }
          limit:              { type: number, required: false, description: "Max actors returned (default 100, cap 500)" }
          offset:             { type: number, required: false, description: "Result offset for pagination (default 0)" }
          summarize_by_class: { type: boolean, required: false, default: false, description: "When true, returns {className: count} instead of per-row actors. Use on dense levels before drilling down." }
      read_asset_properties:
        description: >-
          Read serialized UPROPERTY values from a specific export in a .uasset/.umap.
          Default export is the asset's primary CDO (Default__<Name>_C for BPs, main
          export otherwise). Supports scalars, enums, object refs, soft refs, gameplay
          tags/containers, 24 engine structs (FVector, FRotator, FQuat, FTransform,
          FLinearColor, FColor, FVector2D, FVector4, FGuid, FBox, FIntPoint,
          FBodyInstance, FSoftObjectPath, FSoftClassPath, FGameplayTag,
          FGameplayTagContainer, FExpressionInput, 7 MaterialInput variants),
          simple-element TArray/TSet, and FFieldPath. TMap with scalar keys is
          supported; struct-key TMap and unknown structs return {unsupported, reason}
          markers — never silently skipped.
          Reason codes — parser core: `unknown_struct` (struct outside engine registry —
          tagged self-describing decode applied), `unknown_property_type` (unsupported
          FPropertyTag type), `unexpected_preamble` (non-zero export body preamble —
          non-CDO subclass exports, AssetImportData), `serial_range_out_of_bounds`,
          `value_overruns_serial`, `tag_header_read_failed`, `property_tag_extensions`
          (UE 5.6 FPropertyTagExtensions field unhandled), `value_read_failed`,
          `delegate_not_serialized` (rarely fires on CDOs), `localized_text`,
          `size_budget_exceeded` (max_bytes). Containers: `complex_element_container`
          (TArray/TSet of custom structs without a binary-layout handler),
          `container_deferred` (TMap not yet supported), `container_count_unreasonable`,
          `set_with_removed_items`, `map_with_removed_items`, `map_type_params_missing`,
          `map_key_type_unsupported`, `map_value_type_unsupported`,
          `map_value_struct_name_missing`, `struct_key_map` (TMap with struct keys —
          wire format requires shape-key tagging not yet implemented). Struct-specific:
          `body_instance_native_layout_unknown` (FBodyInstance with HAS_BINARY_NATIVE
          flag — tagged-fallback covers partial overrides; native binary needs a known
          layout), `expression_input_native_layout_unknown` (FExpressionInput /
          MaterialInput beyond the documented native layouts). Handler-level:
          `no_cdo_export_found` (include_defaults=true but CDO export missing),
          `root_component_parse_failed` (list_level_actors only).
          Response capped at max_bytes with truncated flag. When property_names is set,
          unsupported[] is scoped to the filter (plus `__stream__`-wide markers).
        params:
          asset_path:     { type: string, required: true, description: "/Game/... path (with or without extension) or project-relative Content/... path" }
          export_name:    { type: string, required: false, description: "Target export objectName. Default: primary CDO (Default__<Name>_C for BPs) or main export for non-BP assets." }
          property_names: { type: array, items: string, required: false, description: "Filter to specific UPROPERTY names; omit for all readable properties." }
          max_bytes:      { type: number, required: false, description: "Response size budget in declared value bytes (default 65536). When exceeded, properties emit size_budget_exceeded markers (capped at 20) and truncated=true." }
      find_blueprint_nodes:
        description: >-
          Find K2Nodes in a Blueprint by class + member-reference match.
          Covers 19 skeletal K2Node classes — 17 non-delegate (Event, CustomEvent,
          FunctionEntry/Result, VariableGet/Set, CallFunction/CallParentFunction,
          IfThenElse, ExecutionSequence, Switch{Enum,String,Integer}, DynamicCast,
          MacroInstance, Self, Knot) plus 2 delegate-presence classes (AddDelegate,
          AssignDelegate — class identity only, no payload). Answers find/grep
          workflows like "which BPs call X", "what events does this BP handle",
          "where is variable Y accessed". Does NOT trace exec chains — pin edges
          live in the 3F sidecar (D48 S-A scope). Out-of-skeletal K2Node types
          (PromotableOperator, CommutativeAssociativeBinaryOperator,
          BreakStruct/MakeStruct, etc.) are counted in nodes_out_of_skeletal for
          discoverability but not returned. Pointed query — not cached.
        params:
          asset_path:   { type: string, required: true, description: "/Game/... path to a Blueprint .uasset (with or without extension)" }
          node_class:   { type: string, required: false, description: "Filter by K2Node class (e.g., K2Node_CallFunction). Omit for all skeletal types." }
          member_name:  { type: string, required: false, description: "Filter by FMemberReference.MemberName (function/variable/event name) — exact match." }
          target_class: { type: string, required: false, description: "Filter by FMemberReference.MemberParent class path (e.g., /Script/GameplayAbilities.GameplayAbility). Suffix match against target's packagePath also accepted." }
          limit:        { type: number, required: false, description: "Max nodes returned (default 100, cap 1000)." }
          offset:       { type: number, required: false, description: "Result offset for pagination (default 0)." }
      find_blueprint_nodes_bulk:
        description: >-
          Corpus-wide scan for K2Nodes across all Blueprints under a
          path_prefix. Returns aggregated per-BP match counts plus, when
          include_nodes=true, per-BP node details. Filters by node_class,
          member_name, target_class with identical semantics to the single-BP
          find_blueprint_nodes. Use for "which BPs call X", "which BPs
          handle event Y", "where is variable Z accessed across the project"
          workflows — one tool call instead of N round-trips. Results are
          filtered to BPs with match_count > 0; per-BP parse errors surface
          in errors[] rather than failing the whole scan. Two truncation
          flags: scan_truncated=true means the matched-BP set is incomplete
          (widen max_scan or narrow path_prefix); page_truncated=true means
          more BPs matched than this page returned (advance offset). Defaults
          are conservative (limit=50, max_scan=500). With include_nodes=true
          the payload can be large (match_count × BPs) — narrow via filters
          or paginate. Single-BP variant: find_blueprint_nodes.
        params:
          path_prefix:   { type: string,  required: true,  description: "/Game/... path prefix to scan (required). Must start with /Game/." }
          node_class:    { type: string,  required: false, description: "Filter: K2Node class (e.g., K2Node_CallFunction). Same classes as find_blueprint_nodes." }
          member_name:   { type: string,  required: false, description: "Filter: FMemberReference.MemberName exact match." }
          target_class:  { type: string,  required: false, description: "Filter: MemberParent class path — exact or suffix match, same as find_blueprint_nodes." }
          limit:         { type: number,  required: false, description: "Max BPs in response (default 50, cap 200). Applies post-filter to results[]." }
          offset:        { type: number,  required: false, description: "Bulk-level pagination offset over matched BPs (default 0)." }
          max_scan:      { type: number,  required: false, description: "Max Blueprints processed (default 500, cap 5000). Walks the full path_prefix subtree, then caps at this many BPs. scan_truncated=true when the cap clips or the registry query overflows." }
          include_nodes: { type: boolean, required: false, description: "When true, include per-BP nodes[] details. Default false returns counts only for compact output." }
      bp_list_graphs:
        description: >-
          Enumerate UEdGraph subobjects in a Blueprint (EventGraph,
          UserConstructionScript, per-function graphs, macro graphs, delegate
          signature graphs). Returns per-graph records with name, inferred
          graph_type, node_count, comment_count, comment_ids[] (NodeGuid list
          of UEdGraphNode_Comment nodes in that graph — empty array when the
          graph has no comments), and export_index. Offline; no plugin, editor,
          or sidecar required. Use this to orient before bp_find_in_graph or
          bp_show_node. Surfaces comment NodeGuids so callers skip
          inspect_blueprint entirely when locating comments. FA-β response
          manifest (available_fields, not_available) clarifies coverage —
          spatial/comment fields are first-class here.
        params:
          asset_path: { type: string, required: true, description: "/Game/... path to a Blueprint .uasset (with or without extension)" }
      bp_find_in_graph:
        description: >-
          Scope variant of find_blueprint_nodes — filter K2Nodes within a single
          UEdGraph of a Blueprint. Validates graph_name against the BP's graph
          set; returns match rows with graph_name echoed per row for
          disambiguation. Node class and member filters share semantics with
          find_blueprint_nodes. Use bp_list_graphs first to discover graph names.
          Offline (no editor/plugin/sidecar). Spatial fields (position,
          comment, enabled_state) are first-class in match rows.
        params:
          asset_path:   { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
          graph_name:   { type: string, required: true, description: "Graph objectName as returned by bp_list_graphs (e.g., EventGraph, UserConstructionScript, MyFunctionName)." }
          node_class:   { type: string, required: false, description: "Filter by K2Node class (e.g., K2Node_CallFunction). Omit for all skeletal types." }
          member_name:  { type: string, required: false, description: "Filter by FMemberReference.MemberName — exact match." }
          target_class: { type: string, required: false, description: "Filter by FMemberReference.MemberParent — exact or suffix match." }
          limit:        { type: number, required: false, description: "Max nodes returned (default 100, cap 1000)." }
          offset:       { type: number, required: false, description: "Result offset for pagination (default 0)." }
      bp_subgraph_in_comment:
        description: >-
          Return the nodes visually contained inside a UEdGraphNode_Comment box
          using spatial (NodePosX/Y + NodeWidth/Height) center-point rectangle
          containment. Nested comments are reported pairwise (no hierarchy
          inferred). Zero-size comment rectangles return an empty contained
          list. comment_node_id accepts export_index (integer) or node_name
          (string, with _N suffix when serialized). Offline — no plugin or
          editor needed; comment color and text decode via engine struct
          handlers.
        params:
          asset_path:      { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
          comment_node_id: { type: string, required: true, description: "Comment node identifier — either the export_index as a string/integer, or the node's full objectName." }
      bp_list_entry_points:
        description: >-
          Enumerate graph entry points — K2Node_Event, K2Node_CustomEvent, and
          K2Node_FunctionEntry nodes. Returns member_name, graph_name,
          position, enabled_state, export_index, and has_no_exec_in per
          entry. has_no_exec_in is true when no other node's outgoing exec
          pin links into this entry (true entry — reachable only as an
          origin); false when some upstream node feeds exec here (rare —
          complex macro instantiation); null when the graph lookup failed.
          Now advertises `exec_connectivity` in available_fields via
          S-B-base pin-topology. Offline; no editor or plugin.
        params:
          asset_path: { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
      bp_show_node:
        description: >-
          Return the full export record for a single K2Node or comment node —
          class, position (NodePosX/Y/Width/Height), enabled_state,
          NodeComment, NodeGuid, decoded UPROPERTYs, AND the pin block when
          available via S-B-base topology. pins[] entries carry pin_id,
          name, direction (EGPD_Input/Output), pin_kind (exec|data by
          name-convention classification), and linked_to edge list. When
          the node's NodeGuid resolves in the topology, response advertises
          `pin_block` in available_fields; otherwise (non-graph-node,
          malformed pin-block, no NodeGuid) pins=[] with pin_block in
          not_available. node_id accepts export_index (integer or numeric
          string) or full node objectName.
        params:
          asset_path: { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
          node_id:    { type: string, required: true, description: "Node identifier — export_index (integer or numeric string) or full node objectName." }
      bp_trace_exec:
        description: >-
          Walk the outgoing exec chain from a starting node in a specific
          graph. BFS over exec-classified output pins, cycle-safe via
          visited-set, capped by max_depth. Returns an ordered chain of
          visited nodes with the pin each was reached through. Exec
          classification is name-convention (execute/then/else/completed/
          castfailed/loopbody/then_N/Out N/Default) — PinCategory is not
          captured in the current S-B-base parse. Use pin_name to narrow to
          a specific exec pin (e.g., 'then' to follow just the truthy branch
          of an IfThenElse). Offline — uses Oracle-A-v2 topology. Missing
          graph returns `reason: "graph_not_found"`; missing node returns
          `reason: "node_not_found"`. start_node_id accepts either Oracle-A
          canonical (32-hex uppercase BE-per-uint32) OR the M-spatial raw
          form (lowercase byte-LE) emitted by bp_list_entry_points /
          bp_find_in_graph / bp_show_node — both are normalized at the
          input edge.
        params:
          asset_path:    { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
          graph_name:    { type: string, required: true, description: "Graph name (EventGraph, ExecuteAbility, etc.) as returned by bp_list_graphs." }
          start_node_id: { type: string, required: true, description: "NodeGuid (32 hex chars, no dashes). Accepts Oracle-A canonical (uppercase BE-per-uint32) OR M-spatial raw (lowercase byte-LE) — pipe directly from bp_list_entry_points.entry_points[].node_guid or bp_show_node.node.node_guid without reformatting." }
          max_depth:     { type: number, required: false, description: "BFS depth cap (default 50, range 1-500). Chain entries at depth=max_depth are included; their outgoing links are not followed." }
          pin_name:      { type: string, required: false, description: "Restrict walk to a single exec pin name (e.g., 'then', 'else'). Omit to follow all exec outputs." }
      bp_trace_data:
        description: >-
          Walk the outgoing data (non-exec) pin chain from a starting node.
          Returns a flat list of sink edges — each entry is one wire from a
          source pin to a sink pin on a downstream node. Data wires commonly
          have multiple consumers per source, so the output is edge-keyed
          rather than node-deduped. BFS cycle-safe; max_depth caps traversal
          depth. Exec classification (to exclude exec pins) is name-convention
          — see bp_trace_exec for the vocabulary. Offline. Missing graph
          returns `reason: "graph_not_found"`; missing node returns
          `reason: "node_not_found"`. start_node_id accepts either Oracle-A
          canonical or M-spatial raw NodeGuid form (see bp_trace_exec).
        params:
          asset_path:    { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
          graph_name:    { type: string, required: true, description: "Graph name as returned by bp_list_graphs." }
          start_node_id: { type: string, required: true, description: "NodeGuid (32 hex chars, no dashes). Accepts Oracle-A canonical (uppercase BE-per-uint32) OR M-spatial raw (lowercase byte-LE) — pipe directly from bp_list_entry_points / bp_find_in_graph / bp_show_node output without reformatting." }
          max_depth:     { type: number, required: false, description: "BFS depth cap (default 50, range 1-500)." }
      bp_neighbors:
        description: >-
          Immediate-neighbor query. Returns edges adjacent to a target node
          in one or both directions. Each edge carries {node_guid, class_name,
          local_pin, local_pin_name, remote_pin, remote_pin_name, edge_kind}
          where edge_kind is exec|data by name-convention classification.
          Self-loops preserved (appear only in outgoing when direction=both
          to avoid double-counting). Offline — uses Oracle-A-v2 topology.
          Use this for "what nodes connect to X" queries without walking a
          full chain; chain bp_trace_exec/bp_trace_data for deeper traversal.
          node_id accepts either Oracle-A canonical or M-spatial raw
          NodeGuid form (see bp_trace_exec).
        params:
          asset_path: { type: string, required: true, description: "/Game/... path to a Blueprint .uasset" }
          graph_name: { type: string, required: true, description: "Graph name as returned by bp_list_graphs." }
          node_id:    { type: string, required: true, description: "Target NodeGuid (32 hex chars, no dashes). Accepts Oracle-A canonical (uppercase BE-per-uint32) OR M-spatial raw (lowercase byte-LE) — pipe directly from bp_list_entry_points / bp_find_in_graph / bp_show_node output without reformatting." }
          direction:  { type: string, required: false, description: "Edge direction: 'incoming' | 'outgoing' | 'both' (default 'both')." }
      list_data_sources:
        description: Aggregate CSV-backed data sources under Content/ — classifies DataTable vs StringTable CSVs
        params: {}
      read_datatable_source:
        description: Parse a DataTable source CSV with UE conventions (first column = row name). Optional row_struct_header introspects companion USTRUCT fields.
        params:
          file_path:         { type: string, required: true, description: "Project-relative path to .csv (e.g., Content/Data/Foo.csv)" }
          row_struct_header: { type: string, required: false, description: "Project-relative path to .h defining the FTableRowBase USTRUCT" }
      read_string_table_source:
        description: Parse a StringTable source CSV — returns namespace (if present), Key/SourceString/Comment entries
        params:
          file_path: { type: string, required: true, description: "Project-relative path to the StringTable .csv" }
      list_plugins:
        description: List installed plugins with enabled/disabled status and version
      get_build_config:
        description: Parse .Build.cs, .Target.cs — show module dependencies and build settings

  # ── UEMCP Plugin (TCP:55558; reimplemented from legacy oracle) ──
  actors:
    layer: tcp-55558
    priority: null   # M3 (D23): reimplemented on UEMCP custom plugin TCP:55558
    description: Level editing, actor manipulation, viewport
    tools:
      get_actors:
        wire_type: get_actors_in_level
        description: List all actors in current level (with optional class filter)
        params: {}
        # NOTE: C++ handler accepts NO params — class_filter is aspirational (Phase 3)
      find_actors:
        wire_type: find_actors_by_name
        description: Find actors by name pattern
        params:
          pattern: { type: string, required: true, description: "Substring match against actor name (case-sensitive)" }
      spawn_actor:
        description: Spawn primitive actor (StaticMesh, Light, Camera, etc.)
        params:
          type:     { type: string, required: true, description: "One of: StaticMeshActor, PointLight, SpotLight, DirectionalLight, CameraActor" }
          name:     { type: string, required: true, description: "Actor label/name — must be unique in level" }
          location: { type: array, required: false, description: "[x, y, z] world position, default [0,0,0]" }
          rotation: { type: array, required: false, description: "[pitch, yaw, roll] in degrees, default [0,0,0]" }
          scale:    { type: array, required: false, description: "[x, y, z] scale, default [1,1,1]" }
      delete_actor:
        description: Delete actor by name
        params:
          name: { type: string, required: true, description: "Exact actor name" }
      set_actor_transform:
        description: Set location/rotation/scale (partial updates OK — only specified fields change)
        params:
          name:     { type: string, required: true, description: "Exact actor name" }
          location: { type: array, required: false, description: "[x, y, z] — preserves current if omitted" }
          rotation: { type: array, required: false, description: "[pitch, yaw, roll] — preserves current if omitted" }
          scale:    { type: array, required: false, description: "[x, y, z] — preserves current if omitted" }
      get_actor_properties:
        description: Get all properties of an actor
        params:
          name: { type: string, required: true, description: "Exact actor name" }
      set_actor_property:
        description: Set specific property by name (supports bool, int, float, string, enum)
        params:
          name:           { type: string, required: true, description: "Exact actor name" }
          property_name:  { type: string, required: true, description: "UProperty name on the actor" }
          property_value: { type: any, required: true, description: "Value — type coerced to match UProperty" }
      spawn_blueprint_actor:
        description: Spawn instance of a Blueprint class. Pass `name` (canonical, matches spawn_actor); `actor_name` is a deprecated back-compat alias and one of the two is required.
        params:
          blueprint_name: { type: string, required: true, description: "Bare asset name (resolved via /Game/Blueprints/ then AssetRegistry) OR fully-qualified /Game/... path" }
          name:           { type: string, required: false, description: "Name for the spawned actor (canonical — matches spawn_actor + create_procedural_mesh)" }
          actor_name:     { type: string, required: false, description: "Deprecated alias for `name`. Server prefers `name` if both are provided." }
          location:       { type: array, required: false, description: "[x, y, z] default [0,0,0]" }
          rotation:       { type: array, required: false, description: "[pitch, yaw, roll] default [0,0,0]" }
          scale:          { type: array, required: false, description: "[x, y, z] default [1,1,1]" }
      focus_viewport:
        description: Move editor camera to location/actor (provide target OR location, not both)
        params:
          target:      { type: string, required: false, description: "Actor name to focus on" }
          location:    { type: array, required: false, description: "[x, y, z] world position to focus on" }
          distance:    { type: number, required: false, description: "Camera offset distance, default 1000" }
          orientation: { type: array, required: false, description: "[pitch, yaw, roll] camera rotation" }
      take_screenshot:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: false
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        description: Capture editor viewport to PNG file
        note: Legacy — get_viewport_screenshot in visual-capture returns inline base64
        params:
          filepath:     { type: string, required: true, description: "Output file path (.png appended if missing)" }
          resolution_x: { type: number, required: false, description: "Screenshot width in pixels" }
          resolution_y: { type: number, required: false, description: "Screenshot height in pixels" }

  blueprints-write:
    layer: tcp-55558
    priority: null
    description: Blueprint creation, components, nodes
    note: >
      7 more BP node tools (add_function_node, add_variable,
      add_self_reference, add_component_reference, connect_nodes, find_nodes)
      added below. See Section 8 of conformance-oracle-contracts.md for rationale.
      add_input_action_node stays under widgets (already listed there).
    tools:
      create_blueprint:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        description: Create new Blueprint class. Default content path /Game/Blueprints/<name>; pass `path` to override. Other tools in this toolset accept either a bare asset name or a fully-qualified /Game/... path for blueprint_name (resolved via AssetRegistry).
        params:
          name:         { type: string, required: true, description: "Blueprint asset name" }
          parent_class: { type: string, required: false, description: "Parent class name, default AActor. Supports Pawn/Actor shorthand." }
          path:         { type: string, required: false, description: "Content package path (e.g. /Game/Custom/Logic). Default /Game/Blueprints/." }
      add_component:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: true
        offline_fallback: false
        wire_type: add_component_to_blueprint
        description: Add component to Blueprint (auto-compiles after adding)
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          component_type: { type: string, required: true, description: "Class name — flexible resolution (StaticMesh, UStaticMeshComponent, etc.)" }
          component_name: { type: string, required: true, description: "Name for the new component" }
          location:       { type: array, required: false, description: "[x, y, z] — only for SceneComponents" }
          rotation:       { type: array, required: false, description: "[pitch, yaw, roll] — only for SceneComponents" }
          scale:          { type: array, required: false, description: "[x, y, z] — only for SceneComponents" }
      set_component_property:
        description: Set property on Blueprint component template
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          component_name: { type: string, required: true, description: "SCS node variable name" }
          property_name:  { type: string, required: true, description: "UProperty name" }
          property_value: { type: any, required: true, description: "Value — special SpringArm handling for Vector/Rotator" }
      compile_blueprint:
        description: Compile a Blueprint and return diagnostic-quality lifecycle output, including succeeded/compiled flags, error and warning counts, messages, generated-class status, dirty status, and package path.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
      compile_and_save_blueprint:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: true
        compiles_asset: true
        offline_fallback: false
        description: Compile a Blueprint with diagnostic output and save it when compilation succeeds.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name or /Game/... path" }
          fail_on_compile_error: { type: boolean, required: false, default: true, description: "When true, do not save if compile diagnostics contain errors." }
      set_blueprint_property:
        description: Set Blueprint Class Default Object property
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          property_name:  { type: string, required: true, description: "UProperty name on the CDO" }
          property_value: { type: any, required: true, description: "Value — type coerced via SetObjectProperty" }
      set_static_mesh_props:
        wire_type: set_static_mesh_properties
        description: Configure static mesh and material on component
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          component_name: { type: string, required: true, description: "Must be a UStaticMeshComponent" }
          static_mesh:    { type: string, required: false, description: "Asset path e.g. /Game/Meshes/Cube" }
          material:       { type: string, required: false, description: "Asset path — applied to slot 0 only" }
      set_physics_props:
        wire_type: set_physics_properties
        description: Configure physics simulation on a UPrimitiveComponent
        params:
          blueprint_name:   { type: string, required: true, description: "Blueprint asset name" }
          component_name:   { type: string, required: true, description: "Must be a UPrimitiveComponent" }
          simulate_physics: { type: boolean, required: false, description: "Enable/disable physics simulation" }
          mass:             { type: number, required: false, description: "Mass in kg (uses SetMassOverrideInKg)" }
          linear_damping:   { type: number, required: false, description: "Linear damping factor" }
          angular_damping:  { type: number, required: false, description: "Angular damping factor" }
      set_pawn_props:
        wire_type: set_pawn_properties
        description: Configure pawn settings on CDO (per-property results — can partially succeed)
        params:
          blueprint_name:                { type: string, required: true, description: "Blueprint asset name" }
          auto_possess_player:           { type: string, required: false, description: "Enum value e.g. Player0 (maps to EAutoReceiveInput::Player0)" }
          use_controller_rotation_yaw:   { type: boolean, required: false, description: "Maps to bUseControllerRotationYaw" }
          use_controller_rotation_pitch: { type: boolean, required: false, description: "Maps to bUseControllerRotationPitch" }
          use_controller_rotation_roll:  { type: boolean, required: false, description: "Maps to bUseControllerRotationRoll" }
          can_be_damaged:                { type: boolean, required: false, description: "Maps to bCanBeDamaged" }
      add_event_node:
        wire_type: add_blueprint_event_node
        description: Add event node (BeginPlay, Tick, etc.) — deduplicates, returns existing GUID if event already exists. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          event_name:     { type: string, required: true, description: "e.g. ReceiveBeginPlay, ReceiveTick" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
      # ── Orphan BP node handlers (added from conformance oracle Section 8) ──
      add_function_node:
        wire_type: add_blueprint_function_node
        description: Add function call node to a target graph. Supports target class, default pin values, and KismetMathLibrary vector/math/comparison functions. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          function_name:  { type: string, required: true, description: "Function name to call" }
          target:         { type: string, required: false, description: "Target class (e.g. GameplayStatics, KismetMathLibrary). Omit to search BP's own class." }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph; pass function graph name for callback bodies." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
          params:         { type: object, required: false, description: "Default values for function input pins" }
      add_variable:
        wire_type: add_blueprint_variable
        description: Add member variable to Blueprint (5 types supported)
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          variable_name:  { type: string, required: true, description: "Variable name" }
          variable_type:  { type: string, required: true, description: "One of: Boolean, Integer/Int, Float, String, Vector" }
          is_exposed:     { type: boolean, required: false, description: "If true, adds EditAnywhere flag. Default false." }
      add_function_graph:
        wire_type: add_blueprint_function_graph
        description: Create a Blueprint function graph and return its FunctionEntry node with pin metadata. Idempotent by graph/function name.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          function_name:  { type: string, required: true, description: "Function graph name to create" }
      add_variable_get:
        wire_type: add_blueprint_variable_get_node
        description: Add member variable get node to a target Blueprint graph. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          variable_name:  { type: string, required: true, description: "Member variable name" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
      add_variable_set:
        wire_type: add_blueprint_variable_set_node
        description: Add member variable set node to a target Blueprint graph. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          variable_name:  { type: string, required: true, description: "Member variable name" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
          params:         { type: object, required: false, description: "Default values for input pins, keyed by pin name" }
      set_variable_default:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: set_blueprint_variable_default
        description: Set a Blueprint member variable default value on the generated CDO and mark the Blueprint modified. Does not save the asset. Compile behavior is controlled by the optional compile param.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name or fully-qualified /Game/... path" }
          variable_name:  { type: string, required: true, description: "Member variable name" }
          value:          { type: any, required: true, description: "Default value. Supports Number, Boolean, String, and Vector [x,y,z] when the Blueprint variable type permits it. Integer variables require an integral int32 value." }
          compile:        { type: boolean, required: false, default: false, description: "If true, compile after setting the default. Default false." }
      add_variable_assignment:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: add_blueprint_variable_assignment
        description: Add an ergonomic Blueprint variable assignment in a target graph. Supports target_variable = literal and target_variable = source_variable, optional exec wiring, node/pin/link metadata, and requires_compile.
        params:
          blueprint_name:   { type: string, required: true, description: "Blueprint asset name or fully-qualified /Game/... path" }
          target_variable:  { type: string, required: true, description: "Member variable written by the assignment set node" }
          assignment:       { type: object, required: true, description: "{kind:'literal', value:<scalar/vector>} or {kind:'variable', source_variable:<name>}" }
          exec_from:        { type: object, required: false, description: "Optional existing source exec pin: {node_id, pin}" }
          graph_name:       { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:    { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
          compile:          { type: boolean, required: false, description: "If true, compile after authoring. Default false." }
      add_timer:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: add_blueprint_timer
        description: Create a Blueprint SetTimerByFunctionName setup, optionally inserted from ReceiveBeginPlay and optionally creating the callback function graph. Does not save the asset; compile behavior is controlled by the optional compile param.
        params:
          blueprint_name:         { type: string, required: true, description: "Blueprint asset name or fully-qualified /Game/... path" }
          callback_function:      { type: string, required: true, description: "Function graph called by the timer" }
          interval:               { type: number, required: true, description: "Timer interval in seconds. Must be positive." }
          looping:                { type: boolean, required: false, default: true, description: "Whether the timer loops. Default true." }
          create_callback_graph:  { type: boolean, required: false, default: true, description: "Create the callback function graph if missing. Default true." }
          insert_on_begin_play:   { type: boolean, required: false, default: true, description: "Find or create ReceiveBeginPlay and link it to the timer node. Default true." }
          compile:                { type: boolean, required: false, default: false, description: "If true, compile after authoring. Default false." }
      add_control_node:
        wire_type: add_blueprint_control_node
        description: Add a basic control node to a target Blueprint graph. node_kind supports Branch, Sequence, Return. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          node_kind:      { type: string, required: true, description: "One of: Branch, Sequence, Return" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
      add_math_node:
        wire_type: add_blueprint_math_node
        description: Add a graph-targeted KismetMathLibrary node via stable operation names. Supports numeric add/subtract/multiply/comparisons and vector make/break/add/subtract/multiply/scale/distance. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          operation:      { type: string, required: true, description: "One of: Add, Subtract, Multiply, Less, Greater, LessEqual, GreaterEqual, MakeVector, BreakVector, ScaleVector, Distance" }
          value_type:     { type: string, required: false, description: "One of: Float, Int/Integer, Vector. Defaults to Float." }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
          params:         { type: object, required: false, description: "Default values for input pins" }
      add_self_reference:
        wire_type: add_blueprint_self_reference
        description: Add Self reference node (UK2Node_Self) to a target graph. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
      add_component_reference:
        wire_type: add_blueprint_get_self_component_reference
        description: Add VariableGet node for a named component in a target graph. Returns pin metadata.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          component_name: { type: string, required: true, description: "Component variable name" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          node_position:  { type: array, required: false, description: "[x, y] graph position, default [0,0]" }
      connect_nodes:
        wire_type: connect_blueprint_nodes
        description: Connect two Blueprint graph nodes by pin after K2 schema compatibility validation. INCOMPATIBLE_PINS errors include both pin types.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          source_node_id: { type: string, required: true, description: "Source node GUID string" }
          target_node_id: { type: string, required: true, description: "Target node GUID string" }
          source_pin:     { type: string, required: true, description: "Pin name on source node" }
          target_pin:     { type: string, required: true, description: "Pin name on target node" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
      show_pin_links:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: false
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: show_blueprint_pin_links
        description: Read link identities from a named Blueprint graph pin. Returns source/target node and pin metadata without mutating the asset.
        params:
          blueprint_name:    { type: string, required: true, description: "Blueprint asset name or fully-qualified /Game/... path" }
          node_id:           { type: string, required: true, description: "Node GUID string" }
          pin:               { type: string, required: true, description: "Pin name on node" }
          direction:         { type: string, required: false, description: "One of: input, output. Omit to search both directions." }
          target_node_id:    { type: string, required: false, description: "Optional linked node GUID filter" }
          target_pin:        { type: string, required: false, description: "Optional linked pin name filter" }
          target_direction:  { type: string, required: false, description: "One of: input, output. Omit to infer the opposite direction." }
          graph_name:        { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
      disconnect_pin:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: disconnect_blueprint_pin
        description: Disconnect links from a named Blueprint graph pin. Breaks all links on that pin, or a specific target link when target_node_id and target_pin are provided. Reports broken link identities. Does not save the asset; compile behavior is controlled by the optional compile param. Pass dry_run=true to preview without mutation.
        params:
          blueprint_name:    { type: string, required: true, description: "Blueprint asset name or fully-qualified /Game/... path" }
          node_id:           { type: string, required: true, description: "Node GUID string" }
          pin:               { type: string, required: true, description: "Pin name on node" }
          direction:         { type: string, required: false, description: "One of: input, output. Omit to search both directions." }
          target_node_id:    { type: string, required: false, description: "Optional target node GUID for a specific link" }
          target_pin:        { type: string, required: false, description: "Optional target pin name for a specific link" }
          target_direction:  { type: string, required: false, description: "One of: input, output. Omit to infer the opposite direction." }
          graph_name:        { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          dry_run:           { type: boolean, required: false, default: false, description: "If true, report matching links without disconnecting or compiling. Default false." }
          compile:           { type: boolean, required: false, default: false, description: "If true, compile after disconnecting. Default false." }
      delete_nodes:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: delete_blueprint_nodes
        description: Delete one or more Blueprint graph nodes by GUID. Refuses structural nodes such as events and function entry/result nodes unless force=true. Reports node and link preflight details. Does not save the asset; compile behavior is controlled by the optional compile param. Pass dry_run=true to preview without mutation.
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name or fully-qualified /Game/... path" }
          node_ids:       { type: array, required: true, description: "Node GUID strings to delete. Must contain at least one node id." }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          force:          { type: boolean, required: false, default: false, description: "Allow deletion of structural event/function entry/result nodes. Default false." }
          dry_run:        { type: boolean, required: false, default: false, description: "If true, report matching nodes and links without deleting or compiling. Default false." }
          compile:        { type: boolean, required: false, default: false, description: "If true, compile after deleting nodes. Default false." }
      find_nodes:
        wire_type: find_blueprint_nodes
        description: Find nodes in a target graph by type (currently only Event type supported)
        params:
          blueprint_name: { type: string, required: true, description: "Blueprint asset name" }
          node_type:      { type: string, required: true, description: "Currently only 'Event' supported" }
          graph_name:     { type: string, required: false, description: "Target graph name. Omit for EventGraph." }
          event_name:     { type: string, required: false, description: "Required when node_type=Event" }

  widgets:
    layer: tcp-55558
    priority: null
    description: |
      UMG widget creation and binding. Mutation handlers (add_text_block, add_button,
      add_input_action_node) DO NOT auto-compile or save — they only mark the BP
      modified. After a batch of mutations, call blueprints-write.compile_blueprint
      (or bp_compile_and_report for diagnostics) to materialize generated-class
      properties; bind_widget_event / set_text_block_binding self-compile + save
      on completion, so a typical flow that ends with a binding op is auto-finalized.
      Per-call cost: D83 hitch instrumentation logs 'hitch: <handler> ran XXXms'
      to <ProjectName>.log for live-editor verification.
    tools:
      create_widget:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: true
        offline_fallback: false
        wire_type: create_umg_widget_blueprint
        description: Create UMG Widget Blueprint with root CanvasPanel (compiles on creation to establish GeneratedClass). Default content path /Game/Widgets/<name>; pass `path` to override.
        params:
          name: { type: string, required: true, description: "Widget blueprint name" }
          path: { type: string, required: false, description: "Content package path (e.g. /Game/Custom/UI). Default /Game/Widgets/." }
      add_text_block:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        wire_type: add_text_block_to_widget
        description: Add text block to widget (requires root CanvasPanel). Does NOT auto-compile — call compile_blueprint after batch mutations to materialize generated-class properties.
