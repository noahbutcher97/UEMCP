          interval_ms:        { type: number, required: false, description: "Delay between samples in milliseconds; default 100" }
          stable_samples:     { type: number, required: false, description: "Consecutive transform samples required within tolerance; default 2" }
          tolerance:          { type: number, required: false, description: "Maximum absolute component delta for location, rotation, and scale; default 0.01" }
          timeout_ms:         { type: number, required: false, description: "Maximum wait in milliseconds before PIE_ACTOR_NOT_STABLE; default 5000" }

  geometry:
    layer: tcp-55558
    priority: 4
    description: Procedural mesh and CSG (requires Geometry Script plugin)
    tools:
      create_procedural_mesh:
        description: Create Dynamic Mesh actor with primitive shape (box, sphere, cylinder, cone)
        params:
          shape:    { type: string, required: true }
          location: { type: array, required: false }
          # W-I (D144): rotation arg added to close D131-D135 smoke open item #3.
          # Matches spawn_actor.rotation shape — pitch/yaw/roll degrees,
          # optional, default zero rotation. C++ handler reads via UEMCP::ParseRotator.
          rotation: { type: array, required: false, description: "[pitch, yaw, roll] degrees, default [0,0,0]" }
          size:     { type: number, required: false }
      mesh_boolean:
        description: CSG operation (union, difference, intersection) between two meshes
        params:
          target:    { type: string, required: true }
          tool:      { type: string, required: true }
          operation: { type: string, required: true }
      generate_uvs:
        description: Auto-unwrap UVs on a dynamic mesh
        params:
          target: { type: string, required: true }
      # reduced_scope: compiled vertex buffer evaluation + runtime bounds
      # displaced_by: (deferred — offline static-mesh header parse could cover vertex/triangle counts in a future enhancement per §Q1.8)
      get_mesh_info:
        status: shipped
        availability_layer: http-30010
        transport_layer: http-30010
        requires_editor: true
        requires_pie: false
        mutates_asset: false
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        description: "Get vertex count, triangle count, LOD count, bounds, and material slots for a UStaticMesh via 5 batched UFUNCTION calls (GetNumVertices / GetNumTriangles / GetNumLODs / GetBounds / GetStaticMaterials). One of asset_path or target is required. (D131: WebRemoteControl.cpp:930 Passphrase-header workaround in connection-manager.mjs eliminates the prior NEW-2 crash class. Tool functional post-Pivot-W0'.)"
        params:
          asset_path: { type: string, required: false }
          target:     { type: string, required: false }

  editor-utility:
    layer: tcp-55558
    priority: 4
    description: Editor state, Python execution, editor utility Blueprints, asset management. Security-sensitive — Python execution is gated by --enable-python-exec startup flag (off by default) AND a deny-list scan; asset deletion defaults to soft-delete (recoverable from /Game/_Deleted/) with referencer-block.
    note: >
      Includes asset manipulation tools (duplicate/rename/delete). If 8 tools causes
      selection issues, split into editor-utility + asset-management sub-toolset.
      Defense-in-depth posture lives in EditorUtilityHandlers.cpp + the JS executor
      gate in m5-editor-utility-tools.mjs (D101 (iv)).
    tools:
      get_editor_state:
        description: Current level, selected actors, viewport info
        params: {}
      run_python_command:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: true
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        description: Execute Python script. SECURITY-SENSITIVE — requires --enable-python-exec startup flag (Layer 1 server-side gate; PYTHON_EXEC_DISABLED otherwise) AND must pass plugin-side deny-list (rejects os/subprocess/eval/exec/open/__import__ → PYTHON_EXEC_DENY_LIST). Every call audit-logged via LogUEMCPSecurity.
        params:
          command: { type: string, required: true }
      # reduced_scope: Run method binding + editor menu registration; standard BP introspection shipped offline
      # displaced_by: inspect_blueprint, read_asset_properties
      get_editor_utility_blueprint:
        description: Read EUB/EUW — parent class, generated class, Run-method signature, editor-menu registration, variable + function counts
        params:
          asset_path: { type: string, required: true }
      run_editor_utility:
        description: Invoke EUB/EUW Run (or K2_Run) on a transient instance. Run must be zero-arg.
        params:
          asset_path: { type: string, required: true }
      save_asset:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: true
        compiles_asset: false
        offline_fallback: false
        description: Save an editor asset by /Game/... path and report dirty-state before and after save.
        params:
          asset_path: { type: string, required: true, description: "/Game/... asset path to save" }
      duplicate_asset:
        description: Duplicate asset to new path. Refuses pre-existing destination unless overwrite:true.
        params:
          source_path: { type: string, required: true }
          dest_path:   { type: string, required: true }
          overwrite:   { type: boolean, required: false, default: false }
      rename_asset:
        description: Rename / move asset with automatic reference fixup. new_name accepts bare name OR full /Game/... path.
        params:
          asset_path: { type: string, required: true }
          new_name:   { type: string, required: true }
      delete_asset_safe:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: true
        mutates_level: false
        saves_asset: true
        compiles_asset: false
        offline_fallback: false
        description: Delete asset with dependency-check + soft-delete defaults. SECURITY-SENSITIVE — blocks on referencers unless force:true (ASSET_HAS_DEPENDENCIES); defaults to soft-delete (rename to /Game/_Deleted/<name>); permanent:true requires force:true (BAD_PARAMS otherwise). Every successful delete audit-logged.
        params:
          asset_path:    { type: string, required: true }
          force:         { type: boolean, required: false, default: false }
          permanent:     { type: boolean, required: false, default: false }
          move_to_trash: { type: boolean, required: false, default: true }

  visual-capture:
    layer: tcp-55558
    priority: 4
    description: Screenshots, thumbnails, and asset previews as inline images
    note: ~1MB stdio payload limit. Server enforces tool-specific max resolution and MIME output.
    tools:
      get_asset_thumbnail:
        status: planned
        discoverable: false
        replaced_by: get_asset_preview_render
        note: Remapped to callable get_asset_preview_render; excluded as a separate SDK handle.
        description: Content Browser thumbnail as inline PNG (256x256). Batch mode supported. Uses UThumbnailManager.
        params:
          asset_paths: { type: array, items: string, required: true }
      get_viewport_screenshot:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: false
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: false
        description: Active editor viewport as bounded inline base64 PNG, with optional disk output.
        params:
          width:         { type: number, required: false, default: 768 }
          height:        { type: number, required: false, default: 432 }
          return_base64: { type: boolean, required: false, default: true }
          output_path:   { type: string, required: false }
      get_asset_preview_render:
        status: shipped
        availability_layer: tcp-55558
        transport_layer: tcp-55558
        requires_editor: true
        requires_pie: false
        mutates_asset: false
        mutates_level: false
        saves_asset: false
        compiles_asset: false
        offline_fallback: get_asset_info
        description: Asset thumbnail as inline JPEG (any UObject with a UThumbnailRenderer). Covers meshes/materials/textures/blueprints/animations/data-assets. UE's FObjectThumbnail::CompressImageData uses JPEG encoding internally despite the buffer name; mime in response is image/jpeg. Full FPreviewScene offscreen render deferred.
        params:
          asset_path:    { type: string, required: true }
          width:         { type: number, required: false, default: 256 }
          height:        { type: number, required: false, default: 256 }
          return_base64: { type: boolean, required: false, default: true }
          output_path:   { type: string, required: false }
      capture_active_editor_tab:
        status: planned
        discoverable: false
        note: Planned editor-widget capture; excluded until FWidgetRenderer path ships.
        description: Active editor panel (BP graph, material editor, etc.) via FWidgetRenderer. Asset must be open.
        params: {}
      get_asset_visual_summary:
        status: planned
        discoverable: false
        replaced_by: get_asset_preview_render
        note: Planned composite helper; use get_asset_preview_render plus relevant read tools until shipped.
        description: Combines text introspection JSON + inline thumbnail/preview in one MCP response.
        params:
          asset_path: { type: string, required: true }

  # ── Sidecar / narrow-sidecar writer (M-enhance CP5) ──────
  sidecar:
    layer: tcp-55558
    priority: 4
    description: Narrow-sidecar regeneration — plugin-only fields (compile status + full reflection) to <project>/Saved/UEMCP/
    tools:
      regenerate_sidecar:
        description: On-demand narrow-sidecar write for a Blueprint. Save-hook triggers this automatically on BP save; this tool is for backfilling assets that weren't resaved.
        params:
          asset_path: { type: string, required: true }

  # ── Remote Control API (HTTP:30010) ───────────────────────
  remote-control:
    layer: http-30010
    priority: 3   # D66 HYBRID: Phase 4 absorbed into M-enhance, ships alongside reflection tools
    description: Reflection-based property/function access on any UObject via Remote Control HTTP
    tools:
      rc_get_property:
        description: Get any UPROPERTY by object path + property name. NOTE (D100) — after PIE start/stop cycles, newly-created BP CDOs may be GC'd by the editor; if RC returns "object not found" on a path the AssetRegistry confirms exists on disk, call compile_blueprint on that BP first to force-reload the GeneratedClass + CDO, then retry.
        params:
          object_path:   { type: string, required: true }
          property_name: { type: string, required: true }
      rc_set_property:
        description: Set any UPROPERTY by object path + property name + value
        params:
          object_path:   { type: string, required: true }
          property_name: { type: string, required: true }
          value:         { type: any, required: true }
      rc_call_function:
        description: "Call any UFUNCTION on any UObject. **CALLER RESPONSIBILITY (D129)**: target name MUST be UFUNCTION-decorated. RC correctly returns 'Function does not exist on object' when targeted at non-UFUNCTION C++ methods (per UE reflection contract — that's a clean error, not a crash). Look for `UFUNCTION(...)` macro in the engine source before calling. If only `ENGINE_API` (non-UFUNCTION) C++ methods exist for your need, look for UFUNCTION-decorated wrappers (e.g., `UMaterialEditingLibrary::SetMaterialInstance*ParameterValue` wraps the editor-only methods). Post-D131 (Passphrase-header workaround in connection-manager.mjs), non-UFUNCTION targeting is purely an unhelpful error response — no longer a crash risk."
        params:
          object_path:   { type: string, required: true }
          function_name: { type: string, required: true }
          args:          { type: object, required: false }
      rc_list_objects:
        description: Search the AssetRegistry for assets by class name (UE 5.6 — backed by /remote/search/assets; the prior /remote/object/list endpoint was removed). U/A prefix is stripped. Use rc_describe_object for live-object inspection on a known path.
        params:
          class_pattern: { type: string, required: true }
          outer:         { type: string, required: false }
          recursive:     { type: boolean, required: false }
      rc_describe_object:
        description: List all properties and functions on a specific object
        params:
          object_path: { type: string, required: true }
      rc_batch:
        description: "Execute multiple RC operations atomically via /remote/batch. **CALLER RESPONSIBILITY (D129)**: every sub-request's target function MUST be UFUNCTION-decorated for the call to succeed (non-UFUNCTION sub-requests return 400 + 'Function does not exist' cleanly — correct RC behavior, not a foot-gun). The historical NEW-2 crash class (Map.h:716 race n=3) was traced to UE 5.6.1 engine bug WebRemoteControl.cpp:930 and is eliminated by the D131 Passphrase-header workaround in connection-manager.mjs; batch sub-requests now fail-graceful regardless of UFUNCTION decoration. See CLAUDE.md §Operational Limits + D131."
        params:
          operations: { type: array, required: true }
      rc_get_presets:
        description: List Remote Control presets (requires RC Components plugin)
        params: {}
      rc_passthrough:
        description: Raw HTTP request to any RC API endpoint
        params:
          method:   { type: string, required: true }
          endpoint: { type: string, required: true }
          body:     { type: object, required: false }


