# Test rotation — the Node-server regression gate.
#
# Scope is deliberately narrow (see the CI discussion in CLAUDE.md / D-log):
#   - Runs the PRIMARY rotation only (run-rotation.mjs): unit-runnable, no editor.
#     Project-gated offline tools run against the committed text fixture
#     (server/fixtures/uemcp-fixture/) via resolveProjectRoot() — no real
#     UNREAL_PROJECT_ROOT needed, so no env block here.
#   - Does NOT build the C++ plugin (UE 5.6 isn't available on runners).
#   - Does NOT run live-editor (TCP:55558) or binary-asset fixture tests
#     (those skip without real assets; deferred to fixture Phase 2).
#   - Does NOT gate codenames — the forbidden-tokens denylist is intentionally
#     untracked/per-checkout (NDA), so it cannot live in a public-repo workflow.
#     Codename enforcement stays at the local pre-push hook (the public boundary).
#
# Primary value: catches the silent-zero / import-error regression class
# automatically on every push+PR (the D97->D102 failure that lost 234
# assertions for 5 days). run-rotation.mjs is FAIL-LOUD on import errors,
# so a dropped-on-import test file fails the job instead of vanishing.
#
# windows-latest mirrors the only dev environment and avoids false failures
# from path-separator / CRLF assumptions in tests like test-verify-deploy.mjs.

name: rotation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rotation:
    runs-on: windows-latest
    # Contains the explicit per-file budgets in server/rotation-timeouts.mjs.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Run test rotation
        working-directory: server
        run: node run-rotation.mjs
